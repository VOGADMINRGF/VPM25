name: Web CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -C apps/web exec tsc --noEmit -p tsconfig.json
      - run: >-
          pnpm -C apps/web exec vitest run
          tests/i18n.locale-contract.test.ts
          tests/regional-interest.contract.test.ts
      - run: pnpm build
